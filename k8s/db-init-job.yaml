apiVersion: batch/v1
kind: Job
metadata:
  name: gilead-db-init
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: mcr.microsoft.com/mssql-tools
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gilead-secrets
                  key: MSSQL_SA_PASSWORD
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "Waiting for SQL Server..."
              until /opt/mssql-tools/bin/sqlcmd -S gilead-sqlserver,1433 -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b >/dev/null 2>&1; do
                sleep 5
              done

              /opt/mssql-tools/bin/sqlcmd -S gilead-sqlserver,1433 -U sa -P "$MSSQL_SA_PASSWORD" -Q "IF DB_ID('GileadDb') IS NULL CREATE DATABASE GileadDb;" -b
