apiVersion: v1
kind: Service
metadata:
  name: gilead-redis
spec:
  selector:
    app: gilead-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gilead-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gilead-redis
  template:
    metadata:
      labels:
        app: gilead-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gilead-secrets
                  key: Redis__Password
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
