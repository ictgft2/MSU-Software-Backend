apiVersion: v1
kind: Service
metadata:
  name: gilead-api
spec:
  selector:
    app: gilead-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gilead-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gilead-api
  template:
    metadata:
      labels:
        app: gilead-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/gilead-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__GileadDb
              valueFrom:
                secretKeyRef:
                  name: gilead-secrets
                  key: ConnectionStrings__GileadDb
            - name: Redis__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: gilead-secrets
                  key: Redis__ConnectionString
            - name: Redis__Password
              valueFrom:
                secretKeyRef:
                  name: gilead-secrets
                  key: Redis__Password
            - name: Redis__InstanceName
              value: "gilead:"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
