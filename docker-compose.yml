services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: GileadDb
      POSTGRES_USER: gilead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gilead-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gilead -d GileadDb"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devpassword}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-devpassword} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GileadDb: Host=postgres;Port=5432;Database=GileadDb;Username=gilead;Password=${POSTGRES_PASSWORD:-devpassword};Timezone=UTC
      Redis__ConnectionString: redis:6379
      Redis__Password: ${REDIS_PASSWORD:-devpassword}
      Redis__InstanceName: "gilead:"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  gilead-postgres-data:
